<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibrateur de zones</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--border:#d7dce3;--accent:#3b6ef6;--ink:#1c2430;--muted:#68717f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
.tabs,.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;background:#fff}
.tabs button,.seg button{border:0;background:transparent;padding:7px 13px;cursor:pointer;font-size:13px;color:var(--ink);white-space:nowrap}
.tabs button.on,.seg button.on{background:var(--accent);color:#fff}
.spacer{flex:1}
button.tool{border:1px solid var(--border);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
button.tool:hover{background:#f0f3f7}
button.tool.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.tool:disabled{opacity:.45;cursor:not-allowed}
label.tool{display:flex;align-items:center;gap:6px;user-select:none}
.hidden{display:none!important}
.main{flex:1;display:flex;min-height:0}
aside{width:290px;min-width:220px;background:var(--panel);border-right:1px solid var(--border);overflow:auto;padding:10px}
.canvasWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px;background:#e8ecf1}
#mapSvg{width:100%;height:100%;touch-action:none;background:#dfe6ee;cursor:grab;display:block}
#mapSvg.dragging{cursor:grabbing}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px}
ul.list li:hover{background:#eef2f7}
ul.list li.active{background:#dbe7ff;font-weight:600}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle}
.coords{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
.ok{color:#1f9d55}
.resid{color:#b00020;font-size:11px;white-space:nowrap}
.badge{background:#3b6ef6;color:#fff;border-radius:8px;font-size:10px;padding:1px 6px;margin-left:6px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 4px 6px}
.hint{padding:8px 4px;color:var(--muted);font-size:12px}
.kbd{background:#eef2f7;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px}
footer{background:var(--panel);border-top:1px solid var(--border);padding:6px 14px;font-size:12px;color:var(--muted);min-height:28px}
#emptyHint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#1c2430;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;text-align:center;max-width:420px;line-height:1.5;box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:2;pointer-events:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>Calibrateur de zones</h1>
  <div class="tabs" id="continentTabs"></div>
  <div class="seg" id="modeSeg">
    <button data-mode="general">Général</button>
    <button data-mode="subzones">Sous-zones</button>
  </div>
  <label class="tool"><input type="checkbox" id="labelsChk" checked> Étiquettes</label>
  <label class="tool"><input type="checkbox" id="routesAllianceChk" checked> Trajets Alliance</label>
  <label class="tool"><input type="checkbox" id="routesHordeChk" checked> Trajets Horde</label>
  <div class="spacer"></div>
  <button class="tool" id="loadImageBtn" title="Charger une image de carte locale (utile pour Kalimdor)">🖼 Image…</button>
  <input type="file" id="imageFile" accept="image/*" class="hidden">
  <button class="tool" id="revertBtn" title="Recharger les données (abandonne les modifs non sauvegardées)">↺ Recharger</button>
  <button class="tool primary" id="saveBtn" disabled>💾 Sauvegarder</button>
</header>
<div class="main">
  <aside id="sidebar"></aside>
  <div class="canvasWrap" id="canvasWrap">
    <svg id="mapSvg" class="hidden" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="emptyHint" class="hidden"></div>
  </div>
</div>
<footer id="status">Chargement…</footer>
<script src="app.js"></script>
</body>
</html>
